# Gradle settings for the Indycompiled Android build.
# The machine runs other jobs (engine builds, Wine tests) at the same time: keep Gradle modest.
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
org.gradle.workers.max=4
org.gradle.parallel=false
# Let an idle daemon go after 15 minutes instead of 3 hours (frees ~1-2 GB of RAM).
org.gradle.daemon.idletimeout=900000

android.nonTransitiveRClass=true

# Indycompiled knobs (overridable with -P on the command line):
#   indy.abis       comma-separated ABIs to build (phones: arm64-v8a, emulator: x86_64)
#   indy.ninjaJobs  parallel compile jobs per native (CMake/ninja) build
indy.abis=arm64-v8a,x86_64
indy.ninjaJobs=4
